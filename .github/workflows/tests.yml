name: Tests
on:
  push:
    branches: [main]
    paths: ["skills/**/scripts/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["skills/**/scripts/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python scripts
        run: uv run --python 3.12 --with pytest --with python-pptx --with pillow --with imageio-ffmpeg --with latex2mathml --with lxml pytest -q tests
      - name: PowerShell helper parses and is ASCII
        shell: pwsh
        run: ./tests/check_ps.ps1
